name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci || npm install
      - run: npm test
      - run: npm run build
      - run: PYTHONPATH=packages/triager python -m deflake_triager --selftest
      - name: Fixture browsers
        run: |
          npm install -w @deflake/flaky-suite
          npx --prefix fixtures/flaky-suite playwright install chromium
      - name: Deflake demo (expect flake exit 2)
        run: |
          set +e
          node packages/cli/dist/cli.js demo --attempts 10
          code=$?
          set -e
          test "$code" -eq 2
      - name: npm audit (prod)
        run: npm audit --omit=dev --audit-level=high || true

  pack:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - run: npm run build -w @khyfee/deflake-core && npm run build -w @khyfee/deflake-reporters && npm run build -w @khyfee/deflake
      - run: npm pack -w @khyfee/deflake --dry-run
