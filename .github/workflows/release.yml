name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci || npm install
      - run: npm run build -w @khyfee/deflake-core && npm run build -w @khyfee/deflake-reporters && npm run build -w @khyfee/deflake
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
      - name: Publish npm (requires NPM_TOKEN secret)
        continue-on-error: true
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then echo "NPM_TOKEN unset — skip publish"; exit 0; fi
          npm publish -w @khyfee/deflake --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
